<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediGrid — Patient Registration</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-left-brand">
            <a href="/" style="font-size: 1.4rem; font-weight: 800; color: #fff;">✦ MEDIGRID</a>
            <div>
                <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem;">Patient Portal</h1>
                <p style="color: var(--text-secondary);">Secure access to AI symptom guidance, appointments, and prescriptions.</p>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-secondary);">Secure SSL Encrypted</div>
        </div>

        <div class="auth-right-form">
            <div class="auth-card">
                <h2>Create Patient Account</h2>
                <p class="auth-subtitle">Enter your personal details to get started.</p>

                <form id="patientSignupForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="fullName" class="form-control" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" class="form-control" required placeholder="patient@medigrid.demo">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="phone" class="form-control" required placeholder="+1 (555) 000-0000">
                        </div>
                        <div class="form-group">
                            <label>Date of Birth</label>
                            <input type="date" id="dob" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Password (min 8 chars)</label>
                            <input type="password" id="password" class="form-control" required minlength="8" placeholder="••••••••">
                        </div>
                        <div class="form-group">
                            <label>Confirm Password</label>
                            <input type="password" id="confirmPassword" class="form-control" required placeholder="••••••••">
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms" style="font-size: 0.8rem; text-transform: none; margin:0;">I agree to the Terms & Privacy Policy</label>
                    </div>

                    <div id="errorBox" class="error-msg" style="display:none; margin-bottom: 1rem;"></div>

                    <button type="submit" id="submitBtn" class="btn-auth">Create Patient Account</button>
                </form>

                <div class="auth-footer-text">
                    Already have an account? <a href="login.html">Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('patientSignupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'none';

            try {
                btn.textContent = "Creating account...";
                btn.disabled = true;

                const payload = {
                    fullName: document.getElementById('fullName').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    password: document.getElementById('password').value,
                    confirmPassword: document.getElementById('confirmPassword').value
                };

                AuthService.registerPatient(payload);
                setTimeout(() => {
                    window.location.href = "/patient";
                }, 600);
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = 'block';
                btn.textContent = "Create Patient Account";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
