<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediGrid — Login</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-left-brand">
            <a href="/" style="font-size: 1.4rem; font-weight: 800; color: #fff;">✦ MEDIGRID</a>
            <div>
                <h1 style="font-size: 2.8rem; font-weight: 800; margin-bottom: 1rem;">Welcome Back</h1>
                <p style="color: var(--text-secondary);">Sign in to your MediGrid account to continue your connected healthcare journey.</p>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-secondary);">© 2026 MediGrid</div>
        </div>

        <div class="auth-right-form">
            <div class="auth-card">
                <h2>Sign In</h2>
                <p class="auth-subtitle">Select your role and enter your credentials.</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label>Select Role</label>
                        <select id="roleSelect" class="form-control">
                            <option value="patient">Patient</option>
                            <option value="doctor">Doctor</option>
                            <option value="receptionist">Receptionist</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" class="form-control" required placeholder="user@medigrid.demo">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" class="form-control" required placeholder="••••••••">
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin: 1rem 0;">
                        <label style="display: flex; align-items: center; gap: 0.4rem; color: var(--text-secondary); cursor: pointer;">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="forgot-password.html" style="color: var(--cyan-accent); font-weight: 600;">Forgot Password?</a>
                    </div>

                    <div id="errorBox" class="error-msg" style="display:none; margin-bottom: 1rem;"></div>

                    <button type="submit" id="submitBtn" class="btn-auth">Login</button>
                </form>

                <div class="auth-footer-text">
                    Don't have an account? <a href="role-selection.html">Create Account</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'none';

            const role = document.getElementById('roleSelect').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                btn.textContent = "Signing in...";
                btn.disabled = true;

                const user = AuthService.login(email, password, role);
                
                setTimeout(() => {
                    if (user.role === 'patient') window.location.href = "/patient";
                    else if (user.role === 'doctor') window.location.href = "/doctor";
                    else if (user.role === 'receptionist') window.location.href = "/receptionist";
                }, 600);
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = 'block';
                btn.textContent = "Login";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
