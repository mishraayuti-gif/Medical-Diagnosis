<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediGrid — Access Restricted</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
        <div class="auth-card text-center" style="max-width: 440px;">
            <div style="font-size: 3rem; color: var(--danger); margin-bottom: 1rem;">🚫</div>
            <h2>Access Restricted</h2>
            <p class="auth-subtitle" style="margin-bottom: 1.5rem;">You don't have permission to access this area.</p>
            <button onclick="redirectDashboard()" class="btn-auth">Return to Dashboard</button>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        function redirectDashboard() {
            const session = AuthService.getSession();
            if (!session) {
                window.location.href = "/login.html";
                return;
            }
            if (session.role === 'patient') window.location.href = "/patient";
            else if (session.role === 'doctor') window.location.href = "/doctor";
            else if (session.role === 'receptionist') window.location.href = "/receptionist";
            else window.location.href = "/";
        }
    </script>
</body>
</html>
